[project]
name = "code-mentor"
version = "0.1.0"
description = "LLM-based coding mentor with progressive hints"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pre-commit",
    "ruff",
]

[tool.ruff]
line-length = 95
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
